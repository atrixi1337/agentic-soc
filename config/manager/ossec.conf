<!-- Wazuh manager ossec.conf — portable, service-name based (no hardcoded IPs).
     Custom n8n integration fires on alerts level>=10. Active response: soc-quarantine. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <ruleset>
    <include>ruleset/rules/*.xml</include>
    <include>ruleset/decoders/*.xml</include>
    <include>ruleset/ lists/... </include>
    <include>local_rules.xml</include>
  </ruleset>

  <!-- Integration: forward alerts level>=10 to n8n webhook on the docker network -->
  <integration>
    <name>custom-n8n</name>
    <level>10</level>
    <hook_url>http://n8n:5678/webhook/soc-alert</hook_url>
    <alert_format>json</alert_format>
  </integration>

  <!-- Active response: quarantine a malicious file on the endpoint -->
  <command>
    <name>soc-quarantine</name>
    <executable>soc-quarantine.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>soc-quarantine</command>
    <location>local</location>
    <rules_id>100014,100020,100030</rules_id>
    <timeout>0</timeout>
  </active-response>

  <auth>
    <use_password>yes</use_password>
    <allow_remote_enrollment>yes</allow_remote_enrollment>
  </auth>

  <auth_server>
    <port>1515</port>
    <use_password>yes</use_password>
    <force_insert>yes</force_insert>
  </auth_server>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <queue_size>131072</queue_size>
    <agents>1000</agents>
    <verify_msg_id>yes</verify_msg_id>
  </remote>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <system_audit>./rcl/aix/system_audit_rcl.txt</system_audit>
  </rootcheck>

  <wodle name="open-scap">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="audit">
    <disabled>no</disabled>
    <frequency>120</frequency>
    <state>./logs/audit/audit.state</state>
  </wodle>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports>yes</ports>
    <processes>yes</processes>
  </wodle>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <vulnerability-detection>
    <enabled>yes</enabled>
    <interval>4h</interval>
    <min_full_scan_interval>1d</min_full_scan_interval>
    <indexer>
       <enabled>yes</enabled>
       <host>https://wazuh.indexer:9200</host>
       <port>9200</port>
       <username>admin</username>
       <password>${INDEXER_PASSWORD:-SecretPassword}</password>
       <ssl.ca>./certs/root-ca.pem</ssl.ca>
    </indexer>
  </vulnerability-detection>
</ossec_config>
