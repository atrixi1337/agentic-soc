<!-- Wazuh agent ossec.conf for the Linux endpoint.
     FIM on victim dirs + auditd command monitoring + points at manager by service name. -->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux, debian, ubuntu</config-profile>
  </client>

  <syscheck>
    <disabled>no</disabled>
    <frequency>120</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/victim/Downloads</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/victim/Desktop</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/tmp</directories>
  </syscheck>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
  </active-response>
</ossec_config>
