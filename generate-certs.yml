# Certs generator — run once to create Wazuh TLS material under
# config/wazuh_indexer_ssl_certs/. Invoked by bootstrap.sh.
version: '3'
services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.2
    hostname: wazuh-certs-generator
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
